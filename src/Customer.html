<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
</head>
<body>
  <header class="topbar">
    <h1 id="shopName"><?= title ?></h1>
    <a id="shopLink" class="small" hidden>Shop dashboard</a>
    <span id="userEmail" class="user"></span>
  </header>

  <main id="app" class="page" tabindex="-1" aria-live="polite">
    <div class="loading" role="status"><div class="spinner" aria-hidden="true"></div><span>Loading…</span></div>
  </main>

  <div id="cartbar" class="cartbar" hidden>
    <div class="inner">
      <div>
        <div class="small muted" id="cartCount">0 items</div>
        <div class="total" id="cartTotal" aria-live="polite">$0.00</div>
      </div>
      <div class="spacer"></div>
      <button type="button" class="btn primary" id="cartContinue">Continue</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="panel">This app needs JavaScript. Please enable it and reload.</p></noscript>
  <script>window.BOOT = <?!= bootJson ?>;</script>
  <?!= include('Scripts'); ?>
  <?!= include('CustomerJs'); ?>
</body>
</html>
