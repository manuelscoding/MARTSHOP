<style>
  :root {
    --bg: #faf7f3;
    --surface: #ffffff;
    --text: #1f1a17;
    --muted: #5c524b;
    --border: #d9cfc5;
    --brand: #5b3a1e;
    --brand-hover: #472d17;
    --brand-soft: #f1e7dc;
    --ok: #1e6b2d;
    --ok-soft: #e3f3e6;
    --warn: #8a5300;
    --warn-soft: #fff3d6;
    --danger: #b3261e;
    --danger-soft: #fde8e6;
    --info: #0b57a4;
    --info-soft: #e5effa;
    --focus: #1a73e8;
    --radius: 12px;
    --tap: 48px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1.1rem; }
  p { margin: 0 0 .75em; }
  a { color: var(--brand); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- layout ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--brand); color: #fff;
  }
  .topbar h1 { font-size: 1.2rem; margin: 0; flex: 1 1 auto; }
  .topbar a, .topbar .muted { color: #fff; }
  .topbar .user { font-size: .85rem; opacity: .9; overflow-wrap: anywhere; }
  .page { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  .page.wide { max-width: 1400px; padding-bottom: 40px; }
  .page.narrow { max-width: 560px; padding-top: 48px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1 1 auto; }
  .stack > * + * { margin-top: 12px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: var(--tap); padding: 10px 18px; border-radius: 10px;
    border: 2px solid var(--brand); background: var(--surface); color: var(--brand);
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:hover { background: var(--brand-soft); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
  .btn.danger.solid { background: var(--danger); color: #fff; }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn.block { width: 100%; }
  .btn.small { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
  .btn.linklike { border: none; background: none; min-height: auto; padding: 4px; text-decoration: underline; }

  /* ---------- forms ---------- */
  label { font-weight: 600; display: block; margin-bottom: 4px; }
  .hint { font-size: .875rem; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=search], input[type=date], input[type=number], textarea, select {
    width: 100%; min-height: var(--tap); padding: 10px 12px; font: inherit;
    border: 2px solid var(--border); border-radius: 10px; background: #fff; color: var(--text);
  }
  input:focus, textarea:focus, select:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px rgba(26,115,232,.25); }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .field-error { color: var(--danger); font-weight: 600; font-size: .9rem; margin-top: 4px; }
  fieldset { border: none; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 700; font-size: 1.15rem; margin-bottom: 10px; padding: 0; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice span {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 64px; padding: 12px; border: 2px solid var(--border); border-radius: 12px;
    background: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer;
  }
  .choice input:checked + span { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
  .choice input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: center; min-height: var(--tap); font-weight: 500; cursor: pointer; }
  .check input { width: 24px; height: 24px; flex: none; }

  /* ---------- messages ---------- */
  .alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid; }
  .alert.error { background: var(--danger-soft); border-color: #f1b8b2; color: #7a1a14; }
  .alert.warn { background: var(--warn-soft); border-color: #f0d28f; color: #5a3700; }
  .alert.info { background: var(--info-soft); border-color: #b6cfee; color: #083e75; }
  .alert.ok { background: var(--ok-soft); border-color: #a9d8b2; color: #11451d; }
  .loading { display: flex; align-items: center; gap: 12px; justify-content: center; padding: 40px 16px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } * { transition: none !important; } }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100;
    max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 10px;
    background: #222; color: #fff; font-weight: 600; box-shadow: var(--shadow);
  }
  #toast.error { background: var(--danger); }
  #toast.ok { background: var(--ok); }

  /* ---------- modal ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }

  /* ---------- customer: menu & cart ---------- */
  .steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 16px; flex-wrap: wrap; }
  .steps li { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: #eee6de; color: var(--muted); }
  .steps li[aria-current="step"] { background: var(--brand); color: #fff; font-weight: 700; }
  .category { margin: 20px 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  /* ---------- customer: menu cards ---------- */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin: 0 -16px 16px; padding: 20px 16px 18px;
    background: linear-gradient(135deg, #5b3a1e 0%, #7a4a24 55%, #a0612d 100%); color: #fff;
  }
  .hero h2 { font-size: 1.6rem; margin: 0; }
  @media (min-width: 792px) { .hero { margin: 0 0 16px; border-radius: var(--radius); } }
  .hero .hello { margin: 0 0 2px; opacity: .92; font-weight: 600; }
  .open-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.16); font-weight: 700; font-size: .85rem; }
  .open-pill .dot { width: 10px; height: 10px; border-radius: 50%; background: #6ee787; box-shadow: 0 0 0 3px rgba(110,231,135,.3); }
  .open-pill .hours { font-weight: 500; opacity: .9; }
  .menu-tools {
    position: sticky; top: var(--topbar-h, 52px); z-index: 12; background: var(--bg);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0 10px;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; flex: 1 1 auto; }
  .chip {
    --accent: var(--brand);
    display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 8px 14px; border-radius: 999px;
    border: 2px solid var(--accent); background: #fff; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .chip-count { font-size: .75rem; padding: 0 7px; border-radius: 999px; background: rgba(0,0,0,.08); margin-left: 4px; }
  .chip[aria-pressed="true"] .chip-count { background: rgba(255,255,255,.25); }
  .search-wrap { flex: 1 1 200px; max-width: 280px; }
  @media (max-width: 520px) { .search-wrap { max-width: none; } }
  .menu-section { --accent: var(--brand); margin-top: 18px; }
  .section-title { display: flex; align-items: center; gap: 4px; font-size: 1.2rem; color: var(--accent); border-bottom: 3px solid var(--accent); padding-bottom: 6px; margin-bottom: 12px; }
  .section-count { margin-left: auto; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  @media (max-width: 360px) { .menu-grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
  .mcard {
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border: 2px solid var(--border); border-radius: 16px; padding: 34px 10px 12px;
    box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
  }
  .mcard.in-cart { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,58,30,.18), var(--shadow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow); }
  .mcard-icon {
    width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; line-height: 1; margin-bottom: 8px;
    background: var(--brand-soft);
    background: color-mix(in srgb, var(--accent) 12%, #fff);
  }
  .mcard-name { font-size: 1rem; margin: 0 0 4px; line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; }
  .mcard-price { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
  .mcard-actions { width: 100%; margin-top: auto; display: flex; justify-content: center; }
  .add-btn {
    width: 100%; min-height: var(--tap); border-radius: 12px; border: 2px solid var(--accent); background: var(--accent);
    color: #fff; font: inherit; font-weight: 800; cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.1); }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--brand); background: #fff; color: var(--brand);
    font-size: 1.4rem; font-weight: 800; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper input { width: 46px; text-align: center; font-weight: 800; -moz-appearance: textfield; appearance: textfield; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .mcard .stepper button { width: 44px; height: 44px; border-color: var(--accent); color: var(--accent); }
  .mcard .stepper input { width: 46px; min-height: 44px; padding: 6px 2px; }
  .mcard-tag {
    position: absolute; top: 8px; left: 8px; max-width: calc(100% - 52px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 8px; border-radius: 999px;
    font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; background: #ece6e0; color: #3b2a1c;
  }
  .tag-hot, .tag-spicy { background: #fde2dc; color: #9a2412; }
  .tag-iced, .tag-cold { background: #dcecfb; color: #0b4f8a; }
  .tag-seasonal { background: #fdecc8; color: #7a4a00; }
  .tag-special, .tag-house-special, .tag-new, .tag-fan-favorite { background: #efe0fa; color: #5b1f86; }
  .mcard-qty {
    position: absolute; top: 8px; right: 8px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .pop { animation: pop .3s ease-out; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  .cart-icons { display: flex; flex: none; }
  .cart-icons:empty { display: none; }
  .cart-icon {
    width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-left: -10px;
  }
  .cart-icon:first-child { margin-left: 0; }
  .line-icon { margin-right: 6px; }
  .cartbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 2px solid var(--border); box-shadow: 0 -4px 16px rgba(0,0,0,.08);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .cartbar .inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .cartbar .total { font-size: 1.2rem; font-weight: 800; }
  .summary-table { width: 100%; border-collapse: collapse; }
  .summary-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .summary-table td.num { text-align: right; white-space: nowrap; }
  .summary-table tr.total td { font-weight: 800; font-size: 1.1rem; border-bottom: none; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; }
  .kv dt { font-weight: 700; }
  .kv dd { margin: 0; }
  .big-number { font-size: 3rem; font-weight: 800; color: var(--brand); margin: 8px 0; }
  .strike { text-decoration: line-through; color: var(--muted); }

  /* ---------- shop dashboard ---------- */
  .tabs { display: flex; gap: 4px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 56px; z-index: 15; overflow-x: auto; }
  .tabs button { min-height: var(--tap); padding: 10px 18px; border: none; border-bottom: 4px solid transparent; background: none; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .count { display: inline-block; min-width: 24px; padding: 0 7px; margin-left: 6px; border-radius: 999px; background: var(--brand); color: #fff; font-size: .8rem; text-align: center; }
  .conn { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .conn.bad { background: var(--danger); }
  .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; align-items: start; }
  .order-card { background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); position: relative; }
  .order-card.is-new { border-color: var(--info); box-shadow: 0 0 0 4px rgba(11,87,164,.25); animation: pulse 1.6s ease-in-out 3; }
  .order-card.is-updated { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(30,107,45,.22); }
  .order-card.awaiting { border-color: var(--warn); background: #fffdf6; }
  .order-card.awaiting.overdue { border-color: var(--danger); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(11,87,164,.08); } }
  .order-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .order-num { font-size: 1.8rem; font-weight: 800; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; letter-spacing: .02em; }
  .badge.new { background: var(--info); color: #fff; }
  .badge.updated { background: var(--ok); color: #fff; }
  .badge.student { background: #6a1b9a; color: #fff; }
  .status-Pending { background: #e8e0d8; color: #3b2a1c; }
  .status-InProgress { background: var(--info-soft); color: var(--info); }
  .status-AwaitingCustomerResponse { background: var(--warn-soft); color: var(--warn); }
  .status-Completed { background: var(--ok-soft); color: var(--ok); }
  .status-Cancelled { background: var(--danger-soft); color: var(--danger); }
  .elapsed { font-size: .9rem; color: var(--muted); font-weight: 600; }
  .elapsed.old { color: var(--danger); }
  .fulfil { margin: 10px 0; padding: 10px 12px; border-radius: 10px; font-weight: 800; font-size: 1.15rem; }
  .fulfil.delivery { background: #1f1a17; color: #fff; }
  .fulfil.delivery .room { font-size: 1.7rem; letter-spacing: .03em; display: block; }
  .fulfil.pickup { background: var(--brand-soft); color: var(--brand); }
  .order-items { list-style: none; padding: 0; margin: 8px 0; }
  .order-items li { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 1.05rem; }
  .order-items li .qty { font-weight: 800; min-width: 2.2em; }
  .order-items li .icon { width: 1.4em; text-align: center; }
  .menu-admin-item .icon { font-size: 1.6rem; width: 1.6em; text-align: center; }
  .order-items li .price { margin-left: auto; color: var(--muted); }
  .order-items li.unavail .label { text-decoration: line-through; color: var(--muted); }
  .tag-unavail { font-size: .72rem; font-weight: 800; color: var(--danger); margin-left: 6px; }
  .order-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .order-meta .total { font-size: 1.2rem; font-weight: 800; }
  .pay { padding: 3px 10px; border-radius: 8px; font-weight: 800; border: 2px solid currentColor; }
  .pay.Cash { color: var(--ok); }
  .pay.Card { color: var(--info); }
  .waiting { background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; font-weight: 700; color: #5a3700; margin: 8px 0; }
  .waiting.overdue { background: var(--danger-soft); color: #7a1a14; }
  .order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .order-actions .btn { flex: 1 1 auto; }
  .customer { overflow-wrap: anywhere; }
  .notes { font-size: .9rem; background: #f6f2ee; border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 1.1rem; }
  .history-form { display: grid; grid-template-columns: 2fr 1fr auto auto; gap: 10px; align-items: end; }
  @media (max-width: 700px) { .history-form { grid-template-columns: 1fr 1fr; } }
  details.hist { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  details.hist summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; min-height: var(--tap); }
  details.hist .body { padding: 0 14px 14px; }
  .timeline { list-style: none; padding: 0; margin: 8px 0; border-left: 3px solid var(--border); }
  .timeline li { padding: 4px 0 4px 12px; font-size: .9rem; }
  .menu-admin-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .menu-admin-item.off { background: #f4f0ec; color: var(--muted); }
  .switch { position: relative; width: 60px; height: 34px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; background: #b9aea4; border-radius: 34px; transition: background .2s; }
  .switch .track::after { content: ""; position: absolute; width: 26px; height: 26px; left: 4px; top: 4px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track::after { transform: translateX(26px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
