<script>
/**
 * CustomerJs.html — the customer ordering app.
 *
 * Flow: menu -> delivery -> payment -> review -> done
 * Modes (from window.BOOT.mode):
 *   'order'   normal ordering
 *   'respond' opened from the "item unavailable" email ("Continue without")
 *   'revise'  opened from the "Revise my order" email link
 *
 * Prices/totals shown here are for display only. The server recalculates
 * everything from the Menu sheet.
 */
(function () {
  'use strict';
  var h = App.h;
  var BOOT = window.BOOT || {};
  var app = document.getElementById('app');
  var cartbar = document.getElementById('cartbar');

  var S = {
    mode: BOOT.mode || 'order',
    data: null,            // getCustomerBootstrap() result
    menuById: {},
    blocked: {},           // item ids that may not be re-added during a revision
    cart: {},              // id -> qty
    custom: {},            // id -> [[optionId...] per cup] for customizable drinks
    optionById: {},
    step: 'menu',
    delivery: null,
    room: '',
    payment: '',
    name: '',
    requestId: App.uuid(),
    submitting: false,
    respond: null,         // getResponseContext() result
    filterCat: '',         // category chip selected on the menu ('' = all)
    search: '',            // menu search text
    notice: ''
  };

  var STEPS = [['menu', 'Items'], ['delivery', 'Delivery'], ['payment', 'Payment'], ['review', 'Review']];

  /* ---------------- startup ---------------- */

  function init() {
    App.clear(app).appendChild(App.loading('Loading the menu…'));
    cartbar.hidden = true;
    var calls = [App.call('getCustomerBootstrap')];
    if (S.mode === 'respond' || S.mode === 'revise') calls.push(App.call('getResponseContext', BOOT.order, BOOT.token));

    Promise.all(calls).then(function (res) {
      setData(res[0]);
      if (res[1]) S.respond = res[1];
      if (S.mode === 'respond') return renderRespond();
      if (S.mode === 'revise') { startRevision(); return; }
      if (!S.data.orderingOpen) return renderClosed();
      go('menu');
    }).catch(function (err) {
      App.clear(app).appendChild(App.errorPanel(err.message, init));
    });
  }

  function setData(data) {
    S.data = data;
    App.setCurrency(data.currency);
    S.menuById = {};
    data.menu.forEach(function (it) { S.menuById[it.id] = it; });
    S.optionById = {};
    S.optionGroups = [];
    (data.options || []).forEach(function (o) {
      S.optionById[o.id] = o;
      var g = S.optionGroups.filter(function (x) { return x.name === o.group; })[0];
      if (!g) { g = { name: o.group, options: [] }; S.optionGroups.push(g); }
      g.options.push(o);
    });
    document.getElementById('userEmail').textContent = data.user.email;
    var link = document.getElementById('shopLink');
    if (data.user.isShopStaff && BOOT.baseUrl) {
      link.href = BOOT.baseUrl + '?page=shop';
      link.hidden = false;
    }
    if (!S.name) S.name = App.store.get('coffee_name') || data.user.suggestedName || '';
  }

  // Keep the sticky menu filters just below the (possibly wrapped) header.
  function syncTopbar() {
    var bar = document.querySelector('.topbar');
    if (bar) document.documentElement.style.setProperty('--topbar-h', bar.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncTopbar);

  function go(step) {
    syncTopbar();
    S.step = step;
    cartbar.hidden = step !== 'menu';
    if (step === 'menu') renderMenu();
    else if (step === 'delivery') renderDelivery();
    else if (step === 'payment') renderPayment();
    else if (step === 'review') renderReview();
    window.scrollTo(0, 0);
    var heading = app.querySelector('h2');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
  }

  function stepsNav() {
    return h('ol', { class: 'steps', 'aria-label': 'Progress' }, STEPS.map(function (s) {
      return h('li', { 'aria-current': s[0] === S.step ? 'step' : null }, s[1]);
    }));
  }

  function reviseBanner() {
    if (S.mode !== 'revise' || !S.respond) return null;
    var names = S.respond.unavailable.map(function (u) { return u.name; }).join(', ');
    return h('div', { class: 'alert warn' },
      h('strong', null, 'Revising order #' + S.respond.orderNumber + '. '),
      names + (S.respond.unavailable.length > 1 ? ' are' : ' is') + ' not available and has been removed.',
      S.notice ? h('div', { text: S.notice }) : null);
  }

  /* ---------------- cart ---------------- */

  /**
   * Cart as order lines. Customizable drinks are split by their options:
   * two coffees with sugar and one with vanilla syrup become two lines.
   * Prices here are for display only; the server recalculates everything.
   */
  function cartLines() {
    var lines = [];
    S.data.menu.forEach(function (it) {
      var q = S.cart[it.id] || 0;
      if (!q) return;
      if (!it.customizable) {
        lines.push({ id: it.id, name: it.name, icon: it.icon, price: it.price, qty: q, options: [] });
        return;
      }
      var byKey = {};
      var keys = [];
      cupsFor(it.id).forEach(function (ids) {
        var sorted = ids.slice().sort();
        var key = sorted.join(',');
        if (!byKey[key]) {
          var opts = sorted.map(function (oid) { return S.optionById[oid]; });
          var cents = App.cents(it.price) + opts.reduce(function (c, o) { return c + App.cents(o.price); }, 0);
          byKey[key] = { id: it.id, name: it.name, icon: it.icon, price: cents / 100, qty: 0, options: opts };
          keys.push(key);
        }
        byKey[key].qty++;
      });
      keys.forEach(function (k) { lines.push(byKey[k]); });
    });
    return lines;
  }

  /** Per-cup option choices for a drink, kept in step with its quantity. */
  function cupsFor(id) {
    var q = S.cart[id] || 0;
    var cups = (S.custom[id] || []).map(function (ids) {
      return ids.filter(function (oid) { return S.optionById[oid]; });   // drop options no longer offered
    });
    while (cups.length < q) cups.push([]);
    cups.length = q;
    S.custom[id] = cups;
    return cups;
  }

  function customizableInCart() {
    return S.data.menu.filter(function (it) { return it.customizable && S.cart[it.id] > 0; });
  }
  function cartQty() {
    return Object.keys(S.cart).reduce(function (n, id) { return n + (S.cart[id] || 0); }, 0);
  }
  function cartTotal() {
    return cartLines().reduce(function (c, l) { return c + App.cents(l.price) * l.qty; }, 0) / 100;
  }

  function setQty(id, q) {
    var rules = S.data.rules;
    q = Math.floor(Number(q));
    if (!isFinite(q) || q < 0) q = 0;
    if (q > rules.maxQtyPerItem) { q = rules.maxQtyPerItem; App.toast('Maximum ' + rules.maxQtyPerItem + ' of one item.', 'error'); }
    var others = cartQty() - (S.cart[id] || 0);
    if (others + q > rules.maxItemsPerOrder) {
      q = Math.max(0, rules.maxItemsPerOrder - others);
      App.toast('Orders are limited to ' + rules.maxItemsPerOrder + ' items.', 'error');
    }
    if (q) S.cart[id] = q; else delete S.cart[id];
    updateItemRow(id);
    updateCartBar();
  }

  function updateItemRow(id) {
    var card = document.getElementById('item-' + cssId(id));
    if (!card) return;
    var q = S.cart[id] || 0;
    var wasIn = card.classList.contains('in-cart');
    card.classList.toggle('in-cart', q > 0);
    card.querySelector('.add-btn').hidden = q > 0;
    card.querySelector('.stepper').hidden = q === 0;
    card.querySelector('input').value = q;
    card.querySelector('.plus').disabled = q >= S.data.rules.maxQtyPerItem;
    var bubble = card.querySelector('.mcard-qty');
    bubble.hidden = q === 0;
    bubble.textContent = String(q);
    if (q > 0 && !wasIn) pop(card);
  }

  /** Small "added" animation (skipped when the user prefers reduced motion). */
  function pop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function updateCartBar() {
    var n = cartQty();
    document.getElementById('cartCount').textContent = n + (n === 1 ? ' item' : ' items');
    var totalEl = document.getElementById('cartTotal');
    var total = App.money(cartTotal());
    if (totalEl.textContent !== total) { totalEl.textContent = total; pop(totalEl); }
    var icons = document.getElementById('cartIcons');
    App.clear(icons);
    cartLines().slice(0, 6).forEach(function (l) {
      icons.appendChild(h('span', { class: 'cart-icon', title: l.qty + ' × ' + l.name }, l.icon || '•'));
    });
    var btn = document.getElementById('cartContinue');
    btn.disabled = n === 0;
    btn.setAttribute('aria-disabled', n === 0 ? 'true' : 'false');
  }

  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }

  document.getElementById('cartContinue').addEventListener('click', function () {
    if (cartQty() === 0) { App.toast('Please add at least one item.', 'error'); return; }
    if (customizableInCart().length) {
      openCustomizer().then(function (done) { if (done) go('delivery'); });
    } else {
      go('delivery');
    }
  });

  /* ---------------- drink options popup ---------------- */

  /**
   * Popup to choose sweeteners, creamers and syrups for each customizable
   * drink in the cart, one cup at a time. Resolves true when the customer
   * taps Continue, false if they go back.
   */
  function openCustomizer() {
    var drinks = customizableInCart();
    var max = S.data.rules.maxOptionsPerItem || 8;
    var cupBoxes = [];            // [{id, boxes:[checkbox...]}]

    function cupSection(it, cupIndex, count, chosen) {
      var boxes = [];
      var title = it.name + (count > 1 ? ' — cup ' + (cupIndex + 1) + ' of ' + count : '');
      var section = h('section', { class: 'cup', 'aria-label': title },
        h('h3', { class: 'cup-title' }, h('span', { 'aria-hidden': 'true' }, (it.icon || '') + ' '), title),
        S.optionGroups.map(function (g) {
          return h('fieldset', { class: 'opt-group' },
            h('legend', null, g.name),
            h('div', { class: 'opt-chips' }, g.options.map(function (o) {
              var box = h('input', { type: 'checkbox', value: o.id, checked: chosen.indexOf(o.id) !== -1,
                'aria-label': g.name + ': ' + o.name + ' for ' + title,
                onchange: function (e) {
                  var n = boxes.filter(function (b) { return b.checked; }).length;
                  if (n > max) { e.target.checked = false; App.toast('Up to ' + max + ' options per drink.', 'error'); }
                } });
              boxes.push(box);
              return h('label', { class: 'opt-chip' }, box,
                h('span', null, o.name, o.price > 0 ? h('small', null, ' +' + App.money(o.price)) : null));
            })));
        }));
      cupBoxes.push({ id: it.id, boxes: boxes });
      return { el: section, boxes: boxes };
    }

    var body = h('div', { class: 'customizer' },
      h('p', { class: 'hint', style: 'margin-top:0' }, 'Choose how you like each drink. Leave everything unticked for none.'));
    drinks.forEach(function (it) {
      var cups = cupsFor(it.id);
      var first = null;
      cups.forEach(function (chosen, i) {
        var sec = cupSection(it, i, cups.length, chosen);
        body.appendChild(sec.el);
        if (i === 0) {
          first = sec;
          if (cups.length > 1) {
            sec.el.appendChild(h('button', { type: 'button', class: 'btn small', onclick: function () {
              var picked = first.boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; });
              cupBoxes.filter(function (c) { return c.id === it.id; }).forEach(function (c) {
                c.boxes.forEach(function (b) { b.checked = picked.indexOf(b.value) !== -1; });
              });
              App.toast('Copied to all ' + cups.length + ' ' + it.name + ' cups', 'ok');
            } }, 'Same for all ' + cups.length + ' cups'));
          }
        }
      });
    });

    return App.modal({
      title: 'Customize your drinks',
      body: body,
      buttons: [
        { label: 'Back', class: 'btn', value: null },
        { label: 'Continue', class: 'btn primary', value: 'done' }
      ]
    }).then(function (v) {
      if (v !== 'done') return false;
      var next = {};
      cupBoxes.forEach(function (c) {
        (next[c.id] = next[c.id] || []).push(c.boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; }));
      });
      Object.keys(next).forEach(function (id) { S.custom[id] = next[id]; });
      updateCartBar();
      return true;
    });
  }

  /* ---------------- step 1: menu ---------------- */

  // Accent colors for categories; any other category gets a stable color from its name.
  var CATEGORY_ACCENTS = { drinks: '#0f6e8c', snacks: '#b4480f' };

  function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  function accentFor(category) {
    var key = slug(category);
    if (CATEGORY_ACCENTS[key]) return CATEGORY_ACCENTS[key];
    var hash = 0;
    for (var i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) % 360;
    return 'hsl(' + hash + ', 55%, 32%)';
  }

  function priceTag(n) {
    return Number(n) % 1 === 0 ? S.data.currency + Number(n) : App.money(n);
  }

  function greeting() {
    var hr = new Date().getHours();
    var part = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
    var first = String(S.name || '').trim().split(/\s+/)[0];
    return part + (first ? ', ' + first : '') + '!';
  }

  function heroSection() {
    return h('section', { class: 'hero' },
      h('div', { class: 'hero-text' },
        h('p', { class: 'hello' }, greeting()),
        h('h2', null, S.mode === 'revise' ? 'Update your order' : 'What can we get you?')),
      S.data.orderingOpen
        ? h('span', { class: 'open-pill' }, h('span', { class: 'dot', 'aria-hidden': 'true' }), 'Open now', S.data.hours ? h('span', { class: 'hours' }, ' · ' + S.data.hours) : null)
        : null);
  }

  function renderMenu() {
    var items = S.data.menu.filter(function (it) { return !S.blocked[it.id]; });
    var categories = [];
    items.forEach(function (it) { if (categories.indexOf(it.category) === -1) categories.push(it.category); });
    if (S.filterCat && categories.indexOf(S.filterCat) === -1) S.filterCat = '';

    var sections = h('div', { id: 'menuSections' });
    var chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Show category' });
    var search = h('input', {
      type: 'search', id: 'menuSearch', placeholder: 'Search the menu', value: S.search || '', autocomplete: 'off',
      'aria-label': 'Search the menu',
      oninput: function (e) { S.search = e.target.value; drawSections(); }
    });

    function chip(label, cat, icon, count) {
      return h('button', { type: 'button', class: 'chip', 'aria-pressed': String((S.filterCat || '') === cat),
        style: cat ? '--accent:' + accentFor(cat) : null,
        onclick: function () {
          S.filterCat = cat;
          Array.prototype.forEach.call(chips.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
          this.setAttribute('aria-pressed', 'true');
          drawSections();
        } },
        icon ? h('span', { 'aria-hidden': 'true' }, icon + ' ') : null, label,
        count !== undefined ? h('span', { class: 'chip-count' }, String(count)) : null);
    }
    if (categories.length > 1) {
      chips.appendChild(chip('All', ''));
      categories.forEach(function (cat) {
        var inCat = items.filter(function (it) { return it.category === cat; });
        chips.appendChild(chip(cat, cat, inCat[0].icon, inCat.length));
      });
    }

    function drawSections() {
      var q = String(S.search || '').trim().toLowerCase();
      App.clear(sections);
      var shown = 0;
      categories.forEach(function (cat) {
        if (S.filterCat && S.filterCat !== cat) return;
        var inCat = items.filter(function (it) {
          return it.category === cat && (!q || it.name.toLowerCase().indexOf(q) !== -1 || String(it.tag || '').toLowerCase().indexOf(q) !== -1);
        });
        if (!inCat.length) return;
        shown += inCat.length;
        sections.appendChild(h('section', { class: 'menu-section', style: '--accent:' + accentFor(cat), 'aria-label': cat },
          h('h3', { class: 'section-title' }, h('span', { 'aria-hidden': 'true' }, inCat[0].icon + ' '), cat,
            h('span', { class: 'section-count' }, inCat.length + (inCat.length === 1 ? ' item' : ' items'))),
          h('div', { class: 'menu-grid' }, inCat.map(itemCard))));
      });
      var status = document.getElementById('menuStatus');
      if (status) status.textContent = (q || S.filterCat) ? shown + (shown === 1 ? ' item' : ' items') + ' shown' : '';
      if (!shown) {
        sections.appendChild(h('div', { class: 'panel empty' }, q ? 'Nothing matches "' + S.search.trim() + '".' : 'Nothing is available right now. Please check back later.'));
      }
    }

    App.clear(app).appendChild(h('div', null,
      stepsNav(),
      reviseBanner(),
      heroSection(),
      items.length ? h('div', { class: 'menu-tools' }, chips, h('div', { class: 'search-wrap' }, search)) : null,
      sections));
    drawSections();
    updateCartBar();
  }

  function itemCard(it) {
    var q = S.cart[it.id] || 0;
    var max = S.data.rules.maxQtyPerItem;
    var addBtn = h('button', { type: 'button', class: 'add-btn', 'aria-label': 'Add one ' + it.name + ', ' + App.money(it.price), hidden: q > 0,
      onclick: function () { setQty(it.id, 1); focusIn(it.id, '.plus'); } }, 'Add');
    var input = h('input', {
      type: 'number', inputmode: 'numeric', min: '0', max: String(max), step: '1',
      value: String(q), 'aria-label': 'Quantity of ' + it.name,
      onchange: function (e) { setQty(it.id, e.target.value); if (!S.cart[it.id]) focusIn(it.id, '.add-btn'); }
    });
    var stepper = h('div', { class: 'stepper', hidden: q === 0 },
      h('button', { type: 'button', class: 'minus', 'aria-label': 'Remove one ' + it.name,
        onclick: function () { setQty(it.id, (S.cart[it.id] || 0) - 1); if (!S.cart[it.id]) focusIn(it.id, '.add-btn'); } }, '−'),
      input,
      h('button', { type: 'button', class: 'plus', 'aria-label': 'Add one ' + it.name, disabled: q >= max,
        onclick: function () { setQty(it.id, (S.cart[it.id] || 0) + 1); } }, '+'));

    return h('article', { class: 'mcard' + (q ? ' in-cart' : ''), id: 'item-' + cssId(it.id) },
      it.tag ? h('span', { class: 'mcard-tag tag-' + slug(it.tag) }, it.tag) : null,
      h('span', { class: 'mcard-qty', 'aria-hidden': 'true', hidden: q === 0 }, String(q)),
      h('div', { class: 'mcard-icon', 'aria-hidden': 'true' }, it.icon || '•'),
      h('h4', { class: 'mcard-name' }, it.name),
      h('div', { class: 'mcard-price' }, priceTag(it.price)),
      h('div', { class: 'mcard-actions' }, addBtn, stepper));
  }

  function focusIn(id, selector) {
    var card = document.getElementById('item-' + cssId(id));
    var el = card && card.querySelector(selector);
    if (el && !el.hidden) el.focus();
  }

  /* ---------------- step 2: delivery ---------------- */

  function roomError(value) {
    var r = String(value || '').toUpperCase().replace(/\s+/g, ' ').trim();
    var rules = S.data.rules;
    if (!r) return 'Please enter a room number for delivery.';
    if (r.length > rules.roomMax || !/^[A-Z0-9 .\-]+$/.test(r)) return 'Please enter a valid room number (for example 214 or B12).';
    if (rules.allowedRooms.length) return rules.allowedRooms.indexOf(r) === -1 ? 'Delivery is only available to: ' + rules.allowedRooms.join(', ') + '.' : '';
    if (rules.namedRooms.indexOf(r) !== -1) return '';
    var re;
    try { re = new RegExp(rules.roomPattern); } catch (e) { re = /^[A-Z]?[0-9]{1,4}[A-Z]?$/; }
    return re.test(r) ? '' : 'Please enter a valid room number (for example 214 or B12).';
  }

  /** Pickup is allowed if the shop has it open, or if a revision keeps an existing pickup. */
  function pickupAllowed() {
    return S.data.rules.pickupAvailable || (S.mode === 'revise' && S.respond && S.respond.delivery === false);
  }

  function renderDelivery() {
    var rules = S.data.rules;
    var body;
    if (!rules.deliveryEnabled && !pickupAllowed()) {
      body = h('div', { class: 'panel' },
        h('h2', null, 'Pickup is paused'),
        h('p', null, (rules.pickupMessage || 'Pickup is paused right now.') + ' Delivery is not available either, so the shop cannot take this order right now. Please try again soon.'),
        h('button', { type: 'button', class: 'btn', onclick: function () { go('menu'); } }, 'Back'));
      App.clear(app).appendChild(h('div', null, stepsNav(), reviseBanner(), body));
      return;
    }
    if (!rules.deliveryEnabled) {
      S.delivery = false;
      S.room = '';
      body = h('div', { class: 'panel' },
        h('h2', null, 'Pickup'),
        h('p', null, 'Delivery is not available right now, so please pick up your order at the coffee shop.'),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn', onclick: function () { go('menu'); } }, 'Back'),
          h('div', { class: 'spacer' }),
          h('button', { type: 'button', class: 'btn primary', onclick: function () { go('payment'); } }, 'Continue')));
      App.clear(app).appendChild(h('div', null, stepsNav(), reviseBanner(), body));
      return;
    }

    var err = h('div', { class: 'field-error', id: 'roomErr', role: 'alert' });
    var roomInput = h('input', {
      type: 'text', id: 'room', autocomplete: 'off', autocapitalize: 'characters', maxlength: String(rules.roomMax),
      value: S.room, 'aria-describedby': 'roomHint roomErr', required: true,
      oninput: function (e) { S.room = e.target.value; e.target.removeAttribute('aria-invalid'); err.textContent = ''; }
    });
    var hint = rules.allowedRooms.length
      ? 'Delivery is available to: ' + rules.allowedRooms.join(', ') + '.'
      : 'For example 214, B12' + (rules.namedRooms.length ? ', or ' + rules.namedRooms.slice(0, 3).join(', ') : '') + '.';
    var roomBox = h('div', { hidden: S.delivery !== true },
      h('label', { for: 'room' }, 'Room number'), roomInput, h('div', { class: 'hint', id: 'roomHint', text: hint }), err);
    var choiceErr = h('div', { class: 'field-error', role: 'alert' });
    var pickupOk = pickupAllowed();
    if (!pickupOk) {                                   // delivery only right now
      S.delivery = true;
      roomBox.hidden = false;
    }

    function choice(value, label) {
      return h('label', { class: 'choice' },
        h('input', { type: 'radio', name: 'delivery', value: value ? 'yes' : 'no', checked: S.delivery === value,
          onchange: function () { S.delivery = value; roomBox.hidden = !value; choiceErr.textContent = ''; if (value) roomInput.focus(); } }),
        h('span', null, label));
    }

    var form = h('form', { class: 'panel', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      if (S.delivery !== true && S.delivery !== false) { choiceErr.textContent = 'Please choose Yes or No.'; return; }
      if (S.delivery) {
        var msg = roomError(S.room);
        if (msg) { err.textContent = msg; roomInput.setAttribute('aria-invalid', 'true'); roomInput.focus(); return; }
        S.room = S.room.toUpperCase().replace(/\s+/g, ' ').trim();
      } else {
        S.room = '';
      }
      go('payment');
    } },
      pickupOk
        ? h('fieldset', null,
            h('legend', null, h('h2', { style: 'margin:0' }, 'Would you like delivery?')),
            h('div', { class: 'choices' }, choice(true, 'Yes, deliver to my room'), choice(false, 'No, I\'ll pick it up')),
            choiceErr)
        : h('div', null,
            h('h2', null, 'Delivery to your room'),
            h('div', { class: 'alert info' }, (rules.pickupMessage || 'Pickup is paused right now.') + ' We\'ll bring your order to you.')),
      roomBox,
      h('div', { class: 'row', style: 'margin-top:16px' },
        h('button', { type: 'button', class: 'btn', onclick: function () { go('menu'); } }, 'Back'),
        h('div', { class: 'spacer' }),
        h('button', { type: 'submit', class: 'btn primary' }, 'Continue')));

    App.clear(app).appendChild(h('div', null, stepsNav(), reviseBanner(), form));
  }

  /* ---------------- step 3: payment ---------------- */

  function renderPayment() {
    var err = h('div', { class: 'field-error', role: 'alert' });
    function choice(value, label) {
      return h('label', { class: 'choice' },
        h('input', { type: 'radio', name: 'payment', value: value, checked: S.payment === value,
          onchange: function () { S.payment = value; err.textContent = ''; } }),
        h('span', null, label));
    }
    var form = h('form', { class: 'panel', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      if (S.payment !== 'Cash' && S.payment !== 'Card') { err.textContent = 'Please choose cash or card.'; return; }
      go('review');
    } },
      h('fieldset', null,
        h('legend', null, h('h2', { style: 'margin:0' }, 'Are you paying with cash or card?')),
        h('div', { class: 'choices' }, choice('Cash', 'Cash'), choice('Card', 'Card')),
        err,
        h('p', { class: 'hint' }, 'You pay when you ' + (S.delivery ? 'receive your delivery' : 'pick up your order') + '. Nothing is charged online.')),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: function () { go('delivery'); } }, 'Back'),
        h('div', { class: 'spacer' }),
        h('button', { type: 'submit', class: 'btn primary' }, 'Review order')));
    App.clear(app).appendChild(h('div', null, stepsNav(), reviseBanner(), form));
  }

  /* ---------------- step 4: review & submit ---------------- */

  function summaryTable(lines, total) {
    return h('table', { class: 'summary-table' },
      h('caption', { class: 'sr-only' }, 'Order items'),
      h('tbody', null,
        lines.map(function (l) {
          return h('tr', null,
            h('td', null, iconFor(l) ? h('span', { class: 'line-icon', 'aria-hidden': 'true' }, iconFor(l)) : null, l.qty + ' × ' + l.name,
              (l.options && l.options.length) ? h('div', { class: 'line-opts' }, l.options.map(function (o) { return o.name; }).join(', ')) : null),
            h('td', { class: 'num' }, App.money(App.cents(l.price) * l.qty / 100)));
        }),
        h('tr', { class: 'total' }, h('td', null, 'Total'), h('td', { class: 'num' }, App.money(total)))));
  }

  function iconFor(line) {
    return line.icon || (S.menuById[line.id] && S.menuById[line.id].icon) || '';
  }

  function renderReview() {
    var lines = cartLines();
    if (!lines.length) { go('menu'); return; }
    var errBox = h('div', { class: 'alert error', role: 'alert', hidden: true });
    var nameErr = h('div', { class: 'field-error', role: 'alert' });
    var nameInput = h('input', { type: 'text', id: 'custName', autocomplete: 'name', maxlength: String(S.data.rules.nameMax),
      value: S.name, required: true, 'aria-describedby': 'nameErr',
      oninput: function (e) { S.name = e.target.value; nameErr.textContent = ''; e.target.removeAttribute('aria-invalid'); } });
    nameErr.id = 'nameErr';
    var submitBtn = h('button', { type: 'submit', class: 'btn primary block' },
      S.mode === 'revise' ? 'Submit updated order' : 'Place order');

    function editBtn(label, step) {
      return h('button', { type: 'button', class: 'btn linklike small', onclick: function () { go(step); } }, label);
    }

    var form = h('form', { class: 'panel', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      if (S.submitting) return;                                   // double-submit guard
      var name = S.name.replace(/\s+/g, ' ').trim();
      if (!name) { nameErr.textContent = 'Please enter your name.'; nameInput.setAttribute('aria-invalid', 'true'); nameInput.focus(); return; }
      submit(submitBtn, errBox);
    } },
      h('h2', null, S.mode === 'revise' ? 'Review your updated order' : 'Review your order'),
      summaryTable(lines, cartTotal()),
      h('div', { class: 'row' }, editBtn('Change items', 'menu'),
        customizableInCart().length
          ? h('button', { type: 'button', class: 'btn linklike small', onclick: function () {
              openCustomizer().then(function (done) { if (done) renderReview(); });
            } }, 'Change drink options')
          : null),
      h('dl', { class: 'kv' },
        h('dt', null, 'Delivery'), h('dd', null, S.delivery ? 'Yes — Room ' + S.room : 'No — pickup', ' ', editBtn('Change', 'delivery')),
        h('dt', null, 'Payment'), h('dd', null, S.payment, ' ', editBtn('Change', 'payment'))),
      h('div', { style: 'margin-bottom:16px' }, h('label', { for: 'custName' }, 'Name for the order'), nameInput, nameErr),
      errBox,
      submitBtn,
      h('p', { class: 'hint center', style: 'margin-top:10px' }, 'Signed in as ' + S.data.user.email));

    App.clear(app).appendChild(h('div', null, stepsNav(), reviseBanner(), form));
  }

  function submit(btn, errBox) {
    S.submitting = true;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = S.mode === 'revise' ? 'Submitting…' : 'Placing order…';
    errBox.hidden = true;

    var payload = {
      items: cartLines().map(function (l) {
        return { id: l.id, qty: l.qty, options: l.options.map(function (o) { return o.id; }) };
      }),
      name: S.name.replace(/\s+/g, ' ').trim(),
      delivery: S.delivery === true,
      room: S.delivery ? S.room : '',
      payment: S.payment,
      requestId: S.requestId                                     // same id on retry = same order, never a duplicate
    };
    var p = S.mode === 'revise'
      ? App.call('submitRevision', S.respond.orderNumber, BOOT.token, payload)
      : App.call('submitOrder', payload);

    p.then(function (res) {
      S.submitting = false;
      App.store.set('coffee_name', payload.name);
      renderDone(res);
    }).catch(function (err) {
      S.submitting = false;
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.textContent = S.mode === 'revise' ? 'Submit updated order' : 'Place order';
      errBox.textContent = err.message;
      errBox.hidden = false;
      errBox.scrollIntoView({ block: 'center' });
      if (/not available|no longer on the menu|no longer offered|cannot be customized|pickup/i.test(err.message)) refreshMenu();
    });
  }

  /** Reloads the menu after a "not available" error and drops items that disappeared. */
  function refreshMenu() {
    App.call('getCustomerBootstrap').then(function (data) {
      setData(data);
      var removed = [];
      Object.keys(S.cart).forEach(function (id) {
        if (!S.menuById[id] || S.blocked[id]) { removed.push(id); delete S.cart[id]; }
      });
      if (removed.length) App.toast('Your cart was updated because some items are no longer available.', 'error');
    }).catch(function () { /* keep the current screen */ });
  }

  /* ---------------- done ---------------- */

  function renderDone(res) {
    cartbar.hidden = true;
    var revised = S.mode === 'revise';
    var emailNote = res.emailSent
      ? 'A confirmation email was sent to ' + res.customerEmail + '.'
      : 'Your order was received, but we could not send a confirmation email. Please note your order number.';
    App.clear(app).appendChild(h('section', { class: 'panel center', role: 'status' },
      h('h2', null, revised ? 'Order updated!' : 'Order received!'),
      h('p', { class: 'muted' }, 'Your order number is'),
      h('div', { class: 'big-number', 'aria-label': 'Order number ' + res.orderNumber }, '#' + res.orderNumber),
      h('div', { style: 'text-align:left' }, summaryTable(res.items, res.total)),
      h('p', { style: 'margin-top:12px' }, h('strong', null, res.delivery ? 'Delivery to room ' + res.room : 'Pickup at the coffee shop'), ' · Paying by ' + String(res.payment).toLowerCase()),
      h('p', { class: 'small muted' }, emailNote),
      revised
        ? h('a', { class: 'btn primary', href: BOOT.baseUrl || '#', target: '_top' }, 'Start a new order')
        : h('button', { type: 'button', class: 'btn primary', onclick: resetOrder }, 'Place another order')));
    var heading = app.querySelector('h2');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
    window.scrollTo(0, 0);
  }

  function resetOrder() {
    S.cart = {};
    S.custom = {};
    S.delivery = null;
    S.room = '';
    S.payment = '';
    S.requestId = App.uuid();
    if (!S.data.orderingOpen) return renderClosed();
    go('menu');
  }

  function renderClosed() {
    cartbar.hidden = true;
    App.clear(app).appendChild(h('section', { class: 'panel center' },
      h('h2', null, 'Ordering is closed'),
      h('p', null, S.data.closedMessage || 'Please check back later.'),
      h('button', { type: 'button', class: 'btn', onclick: init }, 'Check again')));
  }

  /* ---------------- unavailable-item responses ---------------- */

  function startRevision() {
    var r = S.respond;
    S.mode = 'revise';
    S.blocked = {};
    r.unavailable.forEach(function (u) { S.blocked[u.id] = true; });
    S.cart = {};
    S.custom = {};
    var missing = [];
    var droppedOptions = [];
    r.remaining.forEach(function (l) {
      var it = S.menuById[l.id];
      if (!it) { missing.push(l.name); return; }
      var room = S.data.rules.maxQtyPerItem - (S.cart[l.id] || 0);
      var q = Math.min(l.qty, room);
      if (q <= 0) return;
      S.cart[l.id] = (S.cart[l.id] || 0) + q;
      if (it.customizable) {
        var ids = (l.options || []).map(function (o) {
          if (!S.optionById[o.id] && droppedOptions.indexOf(o.name) === -1) droppedOptions.push(o.name);
          return o.id;
        }).filter(function (oid) { return S.optionById[oid]; });
        for (var i = 0; i < q; i++) (S.custom[l.id] = S.custom[l.id] || []).push(ids.slice());
      }
    });
    S.notice = (missing.length ? 'Also no longer on the menu: ' + missing.join(', ') + '. ' : '') +
      (droppedOptions.length ? 'No longer offered: ' + droppedOptions.join(', ') + '.' : '');
    S.delivery = S.data.rules.deliveryEnabled ? r.delivery : false;
    S.room = r.room || '';
    S.payment = r.payment || '';
    S.name = r.customerName || S.name;
    go('menu');
  }

  function renderRespond() {
    var r = S.respond;
    cartbar.hidden = true;
    var names = r.unavailable.map(function (u) { return u.name; }).join(', ');
    var plural = r.unavailable.length > 1;
    var errBox = h('div', { class: 'alert error', role: 'alert', hidden: true });
    var buttons = [];

    function act(fnName, busyText, confirmFirst) {
      return function (e) {
        var btn = e.currentTarget;
        var start = confirmFirst
          ? App.confirm('Cancel order #' + r.orderNumber + '?', 'Your order will be cancelled. This cannot be undone.', 'Cancel my order', true)
          : Promise.resolve(true);
        start.then(function (ok) {
          if (!ok) return;
          buttons.forEach(function (b) { b.disabled = true; });
          var label = btn.textContent;
          btn.textContent = busyText;
          errBox.hidden = true;
          App.call(fnName, r.orderNumber, BOOT.token).then(function (res) {
            renderResponseDone(fnName, res);
          }).catch(function (err) {
            buttons.forEach(function (b) { b.disabled = false; });
            btn.textContent = label;
            errBox.textContent = err.message;
            errBox.hidden = false;
          });
        });
      };
    }

    var continueBtn = r.remaining.length
      ? h('button', { type: 'button', class: 'btn ok block', onclick: act('respondContinue', 'Updating…') }, 'Continue without ' + (plural ? 'these items' : 'this item'))
      : null;
    var reviseBtn = h('button', { type: 'button', class: 'btn primary block', onclick: startRevision }, 'Revise my order');
    var cancelBtn = h('button', { type: 'button', class: 'btn danger block', onclick: act(r.remaining.length ? 'respondCancel' : 'respondContinue', 'Cancelling…', true) }, 'Cancel my order');
    buttons = [continueBtn, reviseBtn, cancelBtn].filter(Boolean);

    App.clear(app).appendChild(h('section', { class: 'panel stack' },
      h('h2', null, names + (plural ? ' are' : ' is') + ' no longer available'),
      h('p', null, 'Order #' + r.orderNumber + ' is on hold until you choose what to do.'),
      r.remaining.length
        ? h('div', null, h('h3', null, 'Your remaining items'), summaryTable(r.remaining, r.newTotal),
            h('p', { class: 'small muted' }, 'Original total was ' + App.money(r.originalTotal) + '.'))
        : h('div', { class: 'alert warn' }, 'None of your items are available. You can revise your order or cancel it.'),
      errBox,
      buttons,
      r.expiresAt ? h('p', { class: 'hint center' }, 'This link expires ' + App.dateTime(r.expiresAt) + '.') : null));
    var heading = app.querySelector('h2');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
  }

  function renderResponseDone(fnName, res) {
    var cancelled = fnName === 'respondCancel' || res.cancelled || res.status === 'Cancelled';
    App.clear(app).appendChild(h('section', { class: 'panel center', role: 'status' },
      h('h2', null, cancelled ? 'Order cancelled' : 'Thanks — your order is back in the queue'),
      cancelled
        ? h('p', null, 'Order #' + res.orderNumber + ' has been cancelled. No payment is due.')
        : h('div', null,
            h('div', { class: 'big-number' }, '#' + res.orderNumber),
            h('div', { style: 'text-align:left' }, summaryTable(res.items, res.total))),
      h('a', { class: 'btn primary', href: BOOT.baseUrl || '#', target: '_top' }, 'Start a new order')));
    var heading = app.querySelector('h2');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
  }

  init();
})();
</script>
